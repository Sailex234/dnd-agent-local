[project]
name = "shared"
version = "0.1.0"
description = "Cliente de Mongo y schema/CRUD de hojas y encuentros, usado por apps/api"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymongo",
    "pydantic",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
